[project]
name = "agent-collusion-under-observation"
version = "0.2.0"
description = "Covert signalling between small LLM agents, with monitoring and paraphrasing as defences"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["vllm"]
hf = ["torch", "transformers", "accelerate", "tqdm"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
