# Replication on a second, larger model (README, Compute). Same settings, same
# seeds, bigger weights, so the core claim is not resting on one 3B model.
# This is a stretch goal for the sprint, not part of the headline result.
#
#   modal run modal_app.py::run --config configs/modal_replication.yaml --settings sprint
simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [carriers_modal]

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 6
  consolidate_channels: true

llm_models:
  - label: qwen2.5-7b
    llm:
      provider: vllm
      vllm:
        auto_start_server: true
        persistent_server: true
        health_check_path: "/models"
        startup_timeout: 900
        params:
          max_tokens: 1024
          temperature: 0.4
        models:
          - checkpoint: "Qwen/Qwen2.5-7B-Instruct"
            host: "127.0.0.1"
            port: 8020
            tensor_parallel_size: 1
            gpu_memory_utilization: 0.90
            max_model_len: 8192
            trust_remote_code: true
            download_dir: /cache/huggingface
            additional_args:
              - "--enable-auto-tool-choice"

experiment:
  tag: carriers_modal
  output_dir: /results/modal
  seeds: [1, 2, 3, 4, 5, 6, 7, 8]
  # The replication buys the most on the core chain; widen it if credit allows.
  settings: [sprint]
  colluder_count: 2
  max_concurrent_runs: 4
  log_prompts: true
  collusion:
    colluder_selection: random
    agent_order: random
  aux:
    temperature: 0.0
    max_tokens: 600
