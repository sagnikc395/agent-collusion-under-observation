# The one-day sprint plan, and the default config for this project.
#
#   6 settings (RQ1-RQ4) x 8 paired seeds = 48 episodes.
#
# Sized for a single 16GB card (Colab T4): agents are Qwen2.5-3B-Instruct in
# fp16 (~6GB of weights), the judge is a 4-bit 7B run afterwards on the same
# card (~5.6GB). Together that is ~12GB to download instead of the ~45GB the
# 7B + 14B pair needed.
#
# T4 notes: no bf16, so dtype is half; FlashAttention needs sm80, so set
# VLLM_ATTENTION_BACKEND=XFORMERS before starting the server.
simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [carriers_sprint]

# Unchanged from Colosseum's base config: the protocol and the environment are
# what makes the numbers comparable, so the sprint cuts seeds and settings, not
# rounds or agents.
environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 6
  consolidate_channels: true

llm_models:
  - label: qwen2.5-3b
    llm:
      provider: vllm
      vllm:
        auto_start_server: true
        persistent_server: true
        health_check_path: "/models"
        startup_timeout: 600
        params:
          max_tokens: 1024
          temperature: 0.4
        models:
          - checkpoint: "Qwen/Qwen2.5-3B-Instruct"
            host: "127.0.0.1"
            port: 8020
            tensor_parallel_size: 1
            gpu_memory_utilization: 0.90
            # 8k instead of 16k: the KV cache is what a 16GB card runs out of.
            max_model_len: 8192
            trust_remote_code: true
            additional_args:
              - "--enable-auto-tool-choice"
              - "--dtype"
              - "half"

experiment:
  tag: carriers_sprint
  output_dir: results/sprint
  seeds: [1, 2, 3, 4, 5, 6, 7, 8]
  settings: [sprint]
  colluder_count: 2
  # A T4 batches far less than an A100; 2 keeps the KV cache inside 16GB.
  max_concurrent_runs: 2
  log_prompts: true
  collusion:
    colluder_selection: random
    # random | colluders_first (RQ2 fallback if the coalition gains nothing)
    agent_order: random
  aux:
    # Paraphraser / verifier / survey calls on the same base model.
    temperature: 0.0
    max_tokens: 600
